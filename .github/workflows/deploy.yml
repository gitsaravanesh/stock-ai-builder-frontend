
name: Deploy Stock-AI UI to S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-ai-ui-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Stock-AI Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate website files
        run: |
          if [ ! -f site/index.html ]; then
            echo "ERROR: site/index.html is missing"
            exit 1
          fi

          echo "Website files validated."

      - name: Deploy website to S3
        run: |
          aws s3 sync site/ s3://stock-ai-s3-web-page/ \
            --delete \
            --only-show-errors \
            --cache-control "public,max-age=300"

      - name: Verify deployment
        run: |
          aws s3 ls s3://stock-ai-s3-web-page/ --recursive

          echo "Stock-AI website deployment completed successfully!"
